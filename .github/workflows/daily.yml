name: Daily AI Trends

on:
  schedule:
    # 매일 05:23 KST — 정각은 GitHub 스케줄 혼잡 시간대라 피하고, 평균 2시간대 지연을 감안해 앞당김
    - cron: '23 20 * * *'
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: read

# 지연된 스케줄 실행과 수동 실행이 겹치면 push·배포가 경합하므로 직렬화
concurrency:
  group: daily-trends
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      alert: ${{ steps.summarize.outputs.alert }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: 데이터 수집
        run: python3 scripts/collect.py
      # (구) GitHub Models 는 2026-08 retirement brownout(410)으로 종료 수순 → Groq 이전.
      # GROQ_API_KEY 시크릿이 없으면 요약만 건너뛰고 원본 그대로 빌드된다(graceful).
      # 모델은 실행마다 Groq 모델 목록에서 자동 선택된다(고정하려면 env 에 GROQ_MODEL 추가).
      - name: 한국어 요약 (Groq)
        id: summarize
        run: python3 scripts/summarize.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: 사이트 빌드
        run: python3 scripts/build.py
      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json data/health.json index.html
          git diff --staged --quiet || {
            git commit -m "chore: 트렌드 자동 갱신 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          }
      # 아티팩트 업로드는 build 잡에서 수행한다 — deploy 잡만 실패했을 때
      # rerun --failed가 아티팩트를 중복 업로드("Multiple artifacts")하지 않고 배포만 재시도되도록.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true # Pages 일시 장애("try again later")는 1회 재시도로 흡수
      - if: steps.deployment.outcome == 'failure'
        run: sleep 120
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5

  # 사람이 손봐야 할 때만 실패한다(→ GitHub 이 소유자에게 실패 메일을 보냄).
  # 키 거부·쓸 모델 없음·요약 3일 연속 0건일 때만이고, 발행·배포가 끝난 뒤에 돌아 사이트 갱신을 막지 않는다.
  health:
    needs: [build, deploy]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 파이프라인 상태 점검
        env:
          ALERT: ${{ needs.build.outputs.alert }}
        run: |
          if [ -n "$ALERT" ]; then echo "::error::$ALERT"; exit 1; fi
          echo "정상 — 조치할 것 없음"
